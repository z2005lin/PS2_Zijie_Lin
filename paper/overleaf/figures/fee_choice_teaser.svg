<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFC"/><stop offset="1" stop-color="#EEF4F8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B1F33" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#315EFB"/></marker>
    <style>
      .title{font:700 40px Arial,sans-serif;fill:#102A43}.sub{font:400 19px Arial,sans-serif;fill:#486581}.head{font:700 23px Arial,sans-serif;fill:#fff}.label{font:700 19px Arial,sans-serif;fill:#102A43}.body{font:400 17px Arial,sans-serif;fill:#334E68}.small{font:400 15px Arial,sans-serif;fill:#486581}.matrix{font:700 18px Arial,sans-serif;fill:#102A43}.white{fill:#fff}.pill{font:700 16px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1500" height="620" rx="24" fill="url(#bg)"/>
  <text x="750" y="52" text-anchor="middle" class="title">When Do Fee Choices Avoid Congestion?</text>
  <text x="750" y="82" text-anchor="middle" class="sub">A one-shot Bayesian anti-coordination game for two Algorand users</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)"><rect x="32" y="115" width="285" height="350" rx="18" fill="#fff"/><path d="M32 133a18 18 0 0 1 18-18h249a18 18 0 0 1 18 18v52H32z" fill="#163B65"/></g>
  <text x="174" y="155" text-anchor="middle" class="head">1  Private types</text>
  <circle cx="105" cy="244" r="42" fill="#FFB000"/><path d="M91 252h28M105 231v42" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <text x="169" y="236" class="label">Urgent</text><text x="169" y="262" class="small">high delay cost</text>
  <circle cx="105" cy="340" r="42" fill="#14877D"/><circle cx="105" cy="340" r="19" fill="none" stroke="#fff" stroke-width="6"/><path d="M105 327v14l11 7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="169" y="332" class="label">Patient</text><text x="169" y="358" class="small">lower delay cost</text>
  <rect x="57" y="405" width="235" height="38" rx="19" fill="#E8EEF5"/><text x="174" y="430" text-anchor="middle" class="small">Each user observes own type</text>

  <!-- Step 2 -->
  <path d="M328 290H371" stroke="#315EFB" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="386" y="115" width="300" height="350" rx="18" fill="#fff"/><path d="M386 133a18 18 0 0 1 18-18h264a18 18 0 0 1 18 18v52H386z" fill="#315EFB"/></g>
  <text x="536" y="155" text-anchor="middle" class="head">2  Simultaneous choice</text>
  <text x="536" y="224" text-anchor="middle" class="label">USER 1</text><text x="536" y="349" text-anchor="middle" class="label">USER 2</text>
  <rect x="416" y="244" width="112" height="62" rx="12" fill="#E64B35"/><text x="472" y="270" text-anchor="middle" class="pill">HIGH</text><text x="472" y="292" text-anchor="middle" class="pill">FEE</text>
  <text x="545" y="283" text-anchor="middle" class="label">or</text>
  <rect x="570" y="244" width="88" height="62" rx="12" fill="#14877D"/><text x="614" y="270" text-anchor="middle" class="pill">LOW</text><text x="614" y="292" text-anchor="middle" class="pill">FEE</text>
  <line x1="421" y1="325" x2="651" y2="325" stroke="#D9E2EC" stroke-width="2"/>
  <text x="536" y="386" text-anchor="middle" class="small">No user observes the other's</text><text x="536" y="410" text-anchor="middle" class="small">private type before choosing</text>
  <rect x="430" y="425" width="212" height="25" rx="13" fill="#E8EEFF"/><text x="536" y="443" text-anchor="middle" class="small">static • binary • incomplete info</text>

  <!-- Step 3 -->
  <path d="M697 290H740" stroke="#315EFB" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="755" y="115" width="410" height="350" rx="18" fill="#fff"/><path d="M755 133a18 18 0 0 1 18-18h374a18 18 0 0 1 18 18v52H755z" fill="#0E7490"/></g>
  <text x="960" y="155" text-anchor="middle" class="head">3  Payoff matrix</text>
  <text x="960" y="207" text-anchor="middle" class="small">User 2</text><text x="795" y="320" text-anchor="middle" class="small" transform="rotate(-90 795 320)">User 1</text>
  <text x="921" y="236" text-anchor="middle" class="matrix">HIGH</text><text x="1065" y="236" text-anchor="middle" class="matrix">LOW</text>
  <text x="840" y="290" text-anchor="middle" class="matrix">HIGH</text><text x="840" y="386" text-anchor="middle" class="matrix">LOW</text>
  <rect x="870" y="249" width="102" height="78" rx="9" fill="#FDE8E5" stroke="#E64B35" stroke-width="2"/><text x="921" y="279" text-anchor="middle" class="matrix">R<tspan baseline-shift="sub" font-size="13">C</tspan>, R<tspan baseline-shift="sub" font-size="13">C</tspan></text><text x="921" y="307" text-anchor="middle" class="small" fill="#B42318">congestion</text>
  <rect x="984" y="249" width="162" height="78" rx="9" fill="#E3F4F1" stroke="#14877D" stroke-width="2"/><text x="1065" y="279" text-anchor="middle" class="matrix">R<tspan baseline-shift="sub" font-size="13">H</tspan>, R<tspan baseline-shift="sub" font-size="13">L</tspan></text><text x="1065" y="307" text-anchor="middle" class="small">differentiated</text>
  <rect x="870" y="339" width="102" height="78" rx="9" fill="#E3F4F1" stroke="#14877D" stroke-width="2"/><text x="921" y="369" text-anchor="middle" class="matrix">R<tspan baseline-shift="sub" font-size="13">L</tspan>, R<tspan baseline-shift="sub" font-size="13">H</tspan></text><text x="921" y="397" text-anchor="middle" class="small">differentiated</text>
  <rect x="984" y="339" width="162" height="78" rx="9" fill="#FDE8E5" stroke="#E64B35" stroke-width="2"/><text x="1065" y="369" text-anchor="middle" class="matrix">R<tspan baseline-shift="sub" font-size="13">C</tspan>, R<tspan baseline-shift="sub" font-size="13">C</tspan></text><text x="1065" y="397" text-anchor="middle" class="small" fill="#B42318">congestion</text>
  <text x="960" y="446" text-anchor="middle" class="small">Benchmark: R<tspan baseline-shift="sub" font-size="11">H</tspan> &gt; R<tspan baseline-shift="sub" font-size="11">L</tspan> &gt; R<tspan baseline-shift="sub" font-size="11">C</tspan></text>

  <!-- Step 4 -->
  <path d="M1176 290H1219" stroke="#315EFB" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="1234" y="115" width="234" height="350" rx="18" fill="#fff"/><path d="M1234 133a18 18 0 0 1 18-18h198a18 18 0 0 1 18 18v52h-234z" fill="#7C3AED"/></g>
  <text x="1351" y="155" text-anchor="middle" class="head">4  Test</text>
  <rect x="1257" y="213" width="188" height="54" rx="10" fill="#E8EEFF"/><text x="1351" y="236" text-anchor="middle" class="label">Complete info</text><text x="1351" y="257" text-anchor="middle" class="small">benchmark</text>
  <rect x="1257" y="283" width="188" height="54" rx="10" fill="#F3E8FF"/><text x="1351" y="306" text-anchor="middle" class="label">Incomplete info</text><text x="1351" y="327" text-anchor="middle" class="small">baseline</text>
  <rect x="1257" y="353" width="188" height="68" rx="10" fill="#E3F4F1"/><text x="1351" y="377" text-anchor="middle" class="label">Incomplete info</text><text x="1351" y="400" text-anchor="middle" class="small">+ coordination signal</text>
  <text x="1351" y="449" text-anchor="middle" class="small">planned experiment</text>

  <!-- outcomes -->
  <rect x="32" y="500" width="1436" height="88" rx="18" fill="#102A43"/>
  <text x="75" y="534" class="head">Measure</text>
  <circle cx="280" cy="544" r="24" fill="#E64B35"/><text x="280" y="551" text-anchor="middle" class="pill">1</text><text x="316" y="540" class="head" font-size="19">Same-fee</text><text x="316" y="563" class="white" font-family="Arial" font-size="15">congestion rate</text>
  <circle cx="570" cy="544" r="24" fill="#14877D"/><text x="570" y="551" text-anchor="middle" class="pill">2</text><text x="606" y="540" class="head" font-size="19">Successful</text><text x="606" y="563" class="white" font-family="Arial" font-size="15">fee differentiation</text>
  <circle cx="880" cy="544" r="24" fill="#FFB000"/><text x="880" y="551" text-anchor="middle" class="pill">3</text><text x="916" y="540" class="head" font-size="19">Efficient</text><text x="916" y="563" class="white" font-family="Arial" font-size="15">type sorting</text>
  <circle cx="1163" cy="544" r="24" fill="#7C3AED"/><text x="1163" y="551" text-anchor="middle" class="pill">4</text><text x="1199" y="540" class="head" font-size="19">Total welfare</text><text x="1199" y="563" class="white" font-family="Arial" font-size="15">and BNE deviation</text>
</svg>
